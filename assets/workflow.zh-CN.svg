<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" role="img" aria-labelledby="workflowTitle workflowDescription">
  <title id="workflowTitle">daily-podcast-kit 选题确认到发布的流程</title>
  <desc id="workflowDescription">夜间 prepare 只出两到三个选题候选并停下；你在 topic.md 的 CHOICE 行写下选择，把它抓不到的原文放进 materials 目录；prepare --write 才开始写稿、核对引用、本地合成语音并翻译；早晨 publish 之前还有一段审稿窗口，发布到网页与私有 RSS。文献周报是按需运行的第三条流程。</desc>
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      .card { fill:#ffffff; stroke:#d7dee8; stroke-width:1.4; }
      .title { font-size:15px; font-weight:700; fill:#172033; }
      .copy { font-size:11px; fill:#465569; }
      .small { font-size:10px; fill:#536176; }
      .label { font-size:10px; font-weight:800; letter-spacing:1px; fill:#5e6b7e; }
      .pill { fill:#ffffff; stroke:#d7dee8; stroke-width:1.2; }
      .flow { stroke:#64748b; stroke-width:2; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="758" rx="20" fill="#f8fafc" stroke="#d7dee8"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">daily-podcast-kit</text>
  <text x="480" y="65" text-anchor="middle" font-size="12.5" fill="#64748b">每天一集十分钟 · 本地合成语音 · 一页累积所有节目；讲什么由你点头</text>
  <text x="480" y="92" text-anchor="middle" class="label">两个定时任务 · 两道只有你能过的关口</text>

  <g transform="translate(45 112)">
    <rect width="330" height="160" rx="14" fill="#fffaf0" stroke="#e3b866" stroke-width="1.4"/>
    <rect width="5" height="160" rx="2.5" fill="#c77a08"/>
    <circle cx="30" cy="30" r="14" fill="#9a5900"/>
    <text x="30" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
    <text x="54" y="35" class="title" fill="#8a4b00">22:00 · prepare 提案</text>
    <text x="24" y="66" class="copy">来源：queue.md 第一行 &gt; 库里的科学问题与 gap</text>
    <text x="24" y="88" class="copy">两者都没有 → 当晚不出提案，也不编题目</text>
    <text x="24" y="110" class="copy">2–3 个候选写进 episodes/NNN/topic.md</text>
    <text x="24" y="132" class="copy">每个候选：论点、来源、我拿不到的原文</text>
    <text x="24" y="152" class="copy" font-weight="700" fill="#8a4b00">到此为止，一个字的稿子都不写</text>
  </g>

  <g transform="translate(405 122)">
    <rect width="190" height="140" rx="14" fill="#ffffff" stroke="#c0c8d4" stroke-width="1.4" stroke-dasharray="6 4"/>
    <circle cx="28" cy="28" r="14" fill="#536176"/>
    <text x="28" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
    <text x="50" y="33" class="title">你确认</text>
    <text x="20" y="64" class="copy">在 CHOICE: 后写下选择</text>
    <text x="20" y="86" class="copy">我拿不到的原文放进 materials/</text>
    <text x="20" y="108" class="copy" font-weight="700">不确认就不会有稿子</text>
    <text x="20" y="128" class="small">整批都不要 → 删掉这个目录</text>
  </g>

  <g transform="translate(625 112)">
    <rect width="290" height="160" rx="14" fill="#fffaf0" stroke="#e3b866" stroke-width="1.4"/>
    <rect width="5" height="160" rx="2.5" fill="#c77a08"/>
    <circle cx="30" cy="30" r="14" fill="#9a5900"/>
    <text x="30" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
    <text x="54" y="35" class="title" fill="#8a4b00">prepare --write</text>
    <text x="24" y="66" class="copy">materials/ 里的原文全文读</text>
    <text x="24" y="88" class="copy">写 script.txt + episode.json</text>
    <text x="24" y="110" class="copy">links：逐条探测引用，死链剔除</text>
    <text x="24" y="132" class="copy">audio + translate：时间轴实测</text>
    <text x="24" y="152" class="copy" font-weight="700" fill="#8a4b00">写完也还是不发布</text>
  </g>

  <line x1="375" y1="192" x2="399" y2="192" class="flow" marker-end="url(#arrowSlate)"/>
  <line x1="595" y1="192" x2="619" y2="192" class="flow" marker-end="url(#arrowSlate)"/>
  <line x1="770" y1="272" x2="770" y2="334" class="flow" marker-end="url(#arrowSlate)"/>
  <text x="784" y="308" class="small" font-weight="700">写完了，换你审</text>

  <g transform="translate(625 340)">
    <rect width="290" height="130" rx="14" fill="#ffffff" stroke="#c0c8d4" stroke-width="1.4" stroke-dasharray="6 4"/>
    <circle cx="28" cy="28" r="14" fill="#536176"/>
    <text x="28" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
    <text x="50" y="33" class="title">审稿窗口</text>
    <text x="22" y="62" class="copy">改了正文 → 删掉 audio/，早上重合成</text>
    <text x="22" y="84" class="copy">不想要这集 → 删掉整个目录</text>
    <circle cx="26" cy="106" r="4.5" fill="#b42318"/>
    <text x="37" y="110" class="small">prepare 跑完一小时内不允许发布</text>
  </g>

  <g transform="translate(295 330)">
    <rect width="290" height="160" rx="14" fill="#f1f7ff" stroke="#8ab4ed" stroke-width="1.4"/>
    <rect width="5" height="160" rx="2.5" fill="#2563b8"/>
    <circle cx="30" cy="30" r="14" fill="#2563b8"/>
    <text x="30" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text>
    <text x="54" y="35" class="title" fill="#174a8b">09:00 · publish</text>
    <text x="24" y="66" class="copy">build_site：节目与周报 → 一个静态站</text>
    <text x="24" y="88" class="copy">align：防 8 KB 乱码，永远最后一步</text>
    <text x="24" y="110" class="copy">hf 上传 Space；rss 上传 Worker 与 R2</text>
    <text x="24" y="132" class="copy">记入 .published，再做可选的论文入库</text>
    <text x="24" y="152" class="copy" font-weight="700" fill="#174a8b">只发已经就绪的，不临时编内容</text>
  </g>

  <g transform="translate(45 340)">
    <rect width="210" height="140" rx="14" fill="#eefaf4" stroke="#86c8ac" stroke-width="1.4"/>
    <rect width="5" height="140" rx="2.5" fill="#0b8a60"/>
    <text x="107" y="32" text-anchor="middle" class="title" fill="#086548">交付</text>
    <text x="22" y="62" class="copy">网页：一页累积，字幕同步</text>
    <text x="22" y="84" class="copy">私有 RSS：播客 App 与车里</text>
    <text x="22" y="108" class="small">一个失败不会拖住另一个；</text>
    <text x="22" y="124" class="small">周报只在网页，不进 RSS</text>
  </g>

  <line x1="619" y1="405" x2="591" y2="405" class="flow" marker-end="url(#arrowSlate)"/>
  <line x1="289" y1="410" x2="261" y2="410" class="flow" marker-end="url(#arrowSlate)"/>

  <g transform="translate(45 530)">
    <rect width="870" height="88" rx="14" fill="#f7f4ff" stroke="#b4a1df" stroke-width="1.4"/>
    <rect width="5" height="88" rx="2.5" fill="#7251b5"/>
    <text x="24" y="30" class="title" fill="#563594">按需 · podcast.py weekly（第三条流程，不挂定时）</text>
    <text x="24" y="55" class="copy">prompts/weekly.md 编排 → weekly/drafts/日期/issue.json 草稿 → 机械检查：期号 · 日期 · 主题 · 链接 → weekly/issues.json 存档</text>
    <text x="24" y="76" class="small">命令只安装数据并重建本地页面；页面由下一次 publish 带上去，草稿不随页面发布</text>
  </g>

  <g transform="translate(45 646)">
    <rect width="270" height="48" rx="24" class="pill"/>
    <circle cx="25" cy="24" r="6" fill="#b42318"/>
    <text x="42" y="28" font-size="10.5" fill="#465569">没确认过的题目不会变成节目</text>
  </g>
  <g transform="translate(345 646)">
    <rect width="270" height="48" rx="24" class="pill"/>
    <circle cx="25" cy="24" r="6" fill="#c77a08"/>
    <text x="42" y="28" font-size="10.5" fill="#465569">任一步失败就停，绝不发半成品</text>
  </g>
  <g transform="translate(645 646)">
    <rect width="270" height="48" rx="24" class="pill"/>
    <circle cx="25" cy="24" r="6" fill="#0b8a60"/>
    <text x="42" y="28" font-size="10.5" fill="#465569">align 最后一步，发布后手机上真听</text>
  </g>

  <text x="480" y="726" text-anchor="middle" class="small">选题与提案规则见 prompts/propose_topic.md，写稿规则见 prompts/write_episode.md，不变量见 CLAUDE.md</text>
</svg>
